# Netlify Configuration for AI-Powered Study Plan Generator (Full-Stack)

[build]
  command = "npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**"]

# API routes: Route /api/* to the serverless backend function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client routes: Route all other requests to index.html for React Router DOM
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
